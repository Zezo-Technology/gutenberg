<svg xmlns="http://www.w3.org/2000/svg" aria-label="A widget declares a link action as a portable URL. The host renders the widget and materializes the affordance, but does not know which router owns the URL. The application, which owns the router and its routes, provides the links capability through the widget host seam: match recognizes its own routes, Link is its router's primitive. On a match the host mounts the route link and navigation is client-side; without the capability the same declaration mounts a plain anchor." role="img" viewBox="0 0 880 420"><defs><marker id="arrow-wh" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M 0 1 L 8 5 L 0 9 z"/></marker></defs><rect width="868" height="408" x="6" y="6" fill="#fff" rx="12"/><text x="440" y="36" fill="#334155" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">The declaration flows out; the capability flows in.</text><rect width="792" height="290" x="44" y="58" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.4" rx="9"/><text x="64" y="84" fill="#1d6b5a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700">application</text><text x="162" y="84" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10">owns the router and its routes</text><rect width="508" height="232" x="64" y="98" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" rx="9"/><text x="84" y="124" fill="#1d6b5a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700">host</text><text x="130" y="124" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10">renders widgets · materializes affordances</text><rect width="240" height="140" x="84" y="138" fill="#fff3d0" stroke="#b07020" stroke-width="1.5" rx="9"/><text x="104" y="164" fill="#855317" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">widget</text><rect width="208" height="64" x="100" y="176" fill="#fff" stroke="#b07020" stroke-width="1.2" rx="5"/><text x="110" y="194" fill="#b07020" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="700" opacity=".7">action</text><text x="110" y="212" fill="#855317" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">href: &apos;admin.php?page=analytics</text><text x="110" y="226" fill="#855317" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">&amp;p=%2Fsales%3Fby%3Dday&apos;</text><text x="104" y="262" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-style="italic">declares where, as a portable URL</text><line x1="324" x2="340" y1="208" y2="208" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-wh)"/><rect width="208" height="118" x="344" y="160" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.2" rx="5"/><text x="356" y="180" fill="#475569" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">useWidgetHost()</text><text x="356" y="198" fill="#475569" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">links.match( href )</text><line x1="352" x2="544" y1="210" y2="210" stroke="#e2e8f0" stroke-width="1"/><text x="356" y="230" fill="#1d6b5a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700">&lt;Link path=&apos;/sales?by=day&apos; /&gt;</text><text x="356" y="248" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9.5">a real anchor · navigates client-side</text><line x1="600" x2="576" y1="195" y2="195" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-wh)"/><rect width="212" height="110" x="600" y="140" fill="#fff" stroke="#1d6b5a" stroke-width="1.4" rx="9"/><text x="616" y="164" fill="#1d6b5a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">links</text><text x="616" y="186" fill="#475569" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">match( href ): string | null</text><text x="616" y="204" fill="#475569" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">Link: the router&apos;s primitive</text><text x="616" y="232" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic">only the application knows</text><text x="706" y="268" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="700" text-anchor="middle">provided through WidgetHostProvider</text><text x="84" y="316" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-style="italic">without the capability, the same declaration mounts a plain anchor</text><text x="440" y="384" fill="#855317" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" text-anchor="middle">the widget declares where · the host materializes · the application knows how to get there</text></svg>