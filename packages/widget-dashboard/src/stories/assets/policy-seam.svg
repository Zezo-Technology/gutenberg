<svg xmlns="http://www.w3.org/2000/svg" aria-label="The engine asks one question per operation, through a request that names the operation and its subject. The application, which owns the permission model, answers through the policy seam with a single callback. The engine resolves that answer once and every surface follows it: the Customize button and the command palette, the inserter, the tile controls, the drag and resize gestures. Widgets are never asked; without edit they render read-only. Without a policy, every operation is allowed." role="img" viewBox="0 0 880 460"><defs><marker id="arrow-pol" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M 0 1 L 8 5 L 0 9 z"/></marker></defs><rect width="868" height="448" x="6" y="6" fill="#fff" rx="12"/><text x="440" y="36" fill="#334155" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">The question flows out; the answer flows in.</text><rect width="792" height="330" x="44" y="58" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.4" rx="9"/><text x="64" y="84" fill="#1d6b5a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700">application</text><text x="162" y="84" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10">owns the permission model: users, roles, sections, plans</text><rect width="508" height="276" x="64" y="98" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" rx="9"/><text x="84" y="124" fill="#1d6b5a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700">dashboard</text><text x="166" y="124" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10">knows the operations · not the user</text><rect width="468" height="78" x="84" y="140" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.2" rx="5"/><text x="96" y="160" fill="#475569" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">canPerform( { operation: &apos;customize&apos; } )</text><text x="96" y="178" fill="#475569" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">canPerform( { operation: &apos;insert&apos;, widgetType } )</text><text x="96" y="196" fill="#475569" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">canPerform( { operation: &apos;remove&apos;, widget, widgetType } )</text><text x="540" y="210" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic" text-anchor="end">resolved once, in the provider</text><line x1="318" x2="318" y1="218" y2="232" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-pol)"/><rect width="113" height="52" x="84" y="236" fill="#fff" stroke="#cbd5e1" stroke-width="1.2" rx="5"/><text x="140" y="257" fill="#334155" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Customize</text><text x="140" y="274" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" text-anchor="middle">customize · reset</text><rect width="113" height="52" x="202" y="236" fill="#fff" stroke="#cbd5e1" stroke-width="1.2" rx="5"/><text x="258" y="257" fill="#334155" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">inserter</text><text x="258" y="274" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" text-anchor="middle">insert · per type</text><rect width="113" height="52" x="320" y="236" fill="#fff" stroke="#cbd5e1" stroke-width="1.2" rx="5"/><text x="376" y="257" fill="#334155" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">tile controls</text><text x="376" y="274" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" text-anchor="middle">remove · resize · edit</text><rect width="113" height="52" x="438" y="236" fill="#fff" stroke="#cbd5e1" stroke-width="1.2" rx="5"/><text x="494" y="257" fill="#334155" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">gestures</text><text x="494" y="274" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" text-anchor="middle">move · resize</text><text x="84" y="303" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic">the Customize button and the command palette share the first answer</text><text x="84" y="315" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic">a type the inserter rejects keeps rendering where already placed</text><rect width="468" height="40" x="84" y="324" fill="#fff3d0" stroke="#b07020" stroke-width="1.5" rx="9"/><text x="104" y="341" fill="#855317" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700">widget</text><text x="104" y="356" fill="#855317" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-style="italic">never asked · without edit it renders read-only: no setAttributes</text><line x1="600" x2="576" y1="178" y2="178" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-pol)"/><rect width="212" height="112" x="600" y="126" fill="#fff" stroke="#1d6b5a" stroke-width="1.4" rx="9"/><text x="616" y="150" fill="#1d6b5a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">policy</text><text x="616" y="172" fill="#475569" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">canPerform( request ): boolean</text><text x="616" y="190" fill="#475569" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">true for what you do not govern</text><text x="616" y="220" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic">only the application knows</text><text x="706" y="258" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="700" text-anchor="middle">provided through WidgetDashboard.Policy</text><text x="706" y="278" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic" text-anchor="middle">nested policies only narrow</text><text x="706" y="296" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic" text-anchor="middle">without a policy, every operation is allowed</text><text x="440" y="426" fill="#855317" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" text-anchor="middle">the engine asks · the application answers · the surfaces follow</text></svg>